name: Build Debug APK and Publish Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      APK_PATH: app/build/outputs/apk/debug/app-debug.apk
      ARTIFACT_NAME: app-debug-apk
      RELEASE_TAG: apk-r${{ github.run_number }}-a${{ github.run_attempt }}
      RELEASE_TITLE: Lumina Debug APK (Run #${{ github.run_number }}, Attempt ${{ github.run_attempt }})
      RELEASE_ASSET_NAME: app-debug-r${{ github.run_number }}-a${{ github.run_attempt }}.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify active Java version
        run: |
          java -version
          JAVA_VER="$(java -version 2>&1 | head -n 1)"
          echo "Active Java: ${JAVA_VER}"
          if ! echo "${JAVA_VER}" | grep -q '"17\.'; then
            echo "::error::Expected Java 17 to be active, but found: ${JAVA_VER}"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle version
        run: gradle --version

      - name: Generate temporary debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -f debug.keystore

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify generated Debug APK
        run: |
          if [ ! -f "${APK_PATH}" ] || [ ! -s "${APK_PATH}" ]; then
            echo "::error::Expected Debug APK was not found or is empty at ${APK_PATH}"
            exit 1
          fi
          ls -lh "${APK_PATH}"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Debug APK
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAGED_APK="${RUNNER_TEMP}/${RELEASE_ASSET_NAME}"
          cp "${APK_PATH}" "${STAGED_APK}"
          test -s "${STAGED_APK}"

          gh release create "${RELEASE_TAG}" "${STAGED_APK}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "Automated Debug APK build for commit ${GITHUB_SHA} (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT}). Download the APK directly from the **Assets** section below." \
            --latest

          rm -f "${STAGED_APK}"

      - name: Report APK download result
        if: ${{ always() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERIFIED=false
          RELEASE_URL=""

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            if RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [ -n "${RELEASE_URL}" ]; then
              if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "${RELEASE_ASSET_NAME}"; then
                RELEASE_VERIFIED=true
              fi
            fi
          fi

          if [ "${RELEASE_VERIFIED}" = "true" ]; then
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${RELEASE_ASSET_NAME}"
            echo "Download the APK directly from the GitHub Release Assets section."
            echo "Backup: The GitHub Actions artifact '${ARTIFACT_NAME}' is also available on this workflow run."

            {
              echo "### APK Build & Release Summary"
              echo ""
              echo "- **APK Build:** Succeeded (\`${APK_PATH}\`)"
              echo "- **Actions Artifact:** Uploaded as \`${ARTIFACT_NAME}\` (available as a backup)"
              echo "- **Release Publishing:** Succeeded"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset Filename:** \`${RELEASE_ASSET_NAME}\`"
              echo "- **Direct Release Page:** ${RELEASE_URL}"
              echo ""
              echo "Download \`${RELEASE_ASSET_NAME}\` directly from the **Assets** section of the release page above. The standard GitHub Actions artifact \`${ARTIFACT_NAME}\` is also available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed or could not be verified, but the APK build succeeded and the Actions artifact '${ARTIFACT_NAME}' remains available for download."

            {
              echo "### APK Build & Release Summary"
              echo ""
              echo "> **Warning:** GitHub Release publishing did not complete. The APK build succeeded and your build output was not lost."
              echo ""
              echo "- **APK Build:** Succeeded (\`${APK_PATH}\`)"
              echo "- **Release Publishing:** Failed"
              echo "- **Backup Download:** Download the GitHub Actions artifact named \`${ARTIFACT_NAME}\` from this workflow run's **Artifacts** section."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
